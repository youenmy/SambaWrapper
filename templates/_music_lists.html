<div class="p-2 space-y-0.5">
  <!-- «Все треки» не уезжает вместе со списком: закреплена у верхнего края панели -->
  <div class="sticky top-0 z-10 -mx-2 -mt-2 px-2 pt-2 pb-1 bg-white border-b border-slate-100">
    <button class="mus-item w-full text-left px-2 py-1 rounded-lg hover:bg-slate-100 text-sm flex items-center gap-2"
            data-all="1" onclick="Music.clearFilters()"
            {% if tree %}
            ondragover="Music.fs.over(event, {{ library|tojson|forceescape }})"
            ondragleave="Music.fs.leave(event)"
            ondrop="Music.fs.drop(event, {{ library|tojson|forceescape }})"
            title="Все треки — сюда можно перетащить папку, чтобы вынести её в корень библиотеки"
            {% endif %}>
      <i class="ti ti-list text-sky-600"></i>Все треки
    </button>
  </div>


  {# сюда уезжают закреплённые папки; секция скрыта, пока их нет #}
  <div id="mus-pinned-wrap" class="hidden">
    <div class="px-2 pt-3 pb-1 text-[0.6875rem] uppercase tracking-wide text-slate-400">Закреплённые</div>
    <div id="mus-pinned" class="space-y-0.5"></div>
    <div class="mx-2 mt-2 border-t border-slate-200"></div>
  </div>

  <div id="mus-folders-title" class="px-2 pt-3 pb-1 text-[0.6875rem] uppercase tracking-wide text-slate-400">
    {{ 'Дерево папок' if tree else 'Папки библиотеки' }}</div>

  {% if tree %}
    {% include "_music_tree.html" %}
  {% else %}
  {% if not folders %}<div class="px-2 text-xs text-slate-400">Нет подпапок.</div>{% endif %}
  {% for f in folders %}
    <button class="mus-item w-full text-left px-2 py-1 rounded-lg hover:bg-slate-100 text-[0.8125rem] flex items-center gap-1.5 {{ 'mus-on' if f.abs == cur_folder else '' }}"
            data-folder="{{ f.abs }}"
            onclick="Music.filterFolder({{ f.abs|tojson|forceescape }})" title="{{ f.abs }}">
      <i class="ti ti-folder text-amber-500 shrink-0"></i>
      <span class="flex-1 min-w-0 truncate">{{ f.name }}</span>
      <span class="mus-pin shrink-0 text-slate-400 hover:text-sky-600" title="Закрепить наверху"
            onclick="event.stopPropagation(); Music.pins.toggle({{ f.abs|tojson|forceescape }})">
        <i class="ti ti-pin text-sm"></i></span>
      <span class="text-[0.625rem] text-slate-400 shrink-0">{{ f.n }}</span>
    </button>
  {% endfor %}
  {% endif %}
</div>
